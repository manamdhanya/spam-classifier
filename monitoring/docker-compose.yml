services:
  prometheus:
    image: prom/prometheus:latest
    container_name: spam-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
  grafana:
    image: grafana/grafana:latest
    container_name: spam-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
