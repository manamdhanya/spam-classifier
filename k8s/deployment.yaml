
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spam-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spam-streamlit
  template:
    metadata:
      labels:
        app: spam-streamlit
    spec:
      containers:
        - name: spam-streamlit
          image: sms-spam-classifier:v3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8501
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 15
            periodSeconds: 5